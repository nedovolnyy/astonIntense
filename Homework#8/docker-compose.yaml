services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d userDB" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - homework8_default

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homework8_default

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8071:8071"
    environment:
      - "SPRING_PROFILES_ACTIVE=docker,native"
    volumes:
      - ./configs:/config-server/configs
    healthcheck:
      test:  wget --no-verbose --tries=1 --output-document=/dev/null http://localhost:8071/actuator/health &> /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - homework8_default

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8071
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --output-document=/dev/null http://localhost:8761/actuator/health &> /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - homework8_default

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8071
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userDB
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --output-document=/dev/null http://localhost:8080/actuator/health &> /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homework8_default

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8071
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --output-document=/dev/null http://localhost:8081/actuator/health &> /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homework8_default

  gateway-api:
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    container_name: gateway-api
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8071
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - homework8_default

volumes:
  kafka_data:
  postgres_data:

networks:
  homework8_default:
    driver: bridge
  