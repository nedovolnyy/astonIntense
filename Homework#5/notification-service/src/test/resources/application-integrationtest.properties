server.port=8081
spring.application.name=Notification-service

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=consumer-notification-user-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.from-email=admin@userservice.su
spring.kafka.consumer.create-message=\u0417\u0434\u0440\u0430\u0432\u0441\u0442\u0432\u0443\u0439\u0442\u0435! \u0412\u0430\u0448 \u0430\u043a\u043a\u0430\u0443\u043d\u0442 \u043d\u0430 \u0441\u0430\u0439\u0442\u0435 \u0432\u0430\u0448 \u0441\u0430\u0439\u0442 \u0431\u044b\u043b \u0443\u0441\u043f\u0435\u0448\u043d\u043e \u0441\u043e\u0437\u0434\u0430\u043d.
spring.kafka.consumer.delete-message=\u0417\u0434\u0440\u0430\u0432\u0441\u0442\u0432\u0443\u0439\u0442\u0435! \u0412\u0430\u0448 \u0430\u043a\u043a\u0430\u0443\u043d\u0442 \u0431\u044b\u043b \u0443\u0434\u0430\u043b\u0451\u043d.
spring.kafka.consumer.listenable-topics=user_create,user_delete

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=username
spring.mail.password=password
spring.mail.protocol=smtps
mailpit.web.port=8025

logging.file.name=logs/log.log
logging.level.org.springframework=OFF
logging.level.com.notificationservice=trace
logging.level.web=OFF
logging.logback.rollingpolicy.clean-history-on-start=true